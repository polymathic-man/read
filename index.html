<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Read</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="fonts/fonts.css" rel="stylesheet">
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            serif: ['"Lora"', '"Crimson Pro"', 'Georgia', 'serif'],
            sans: ['"Inter"', '"Helvetica Neue"', 'system-ui', '-apple-system', 'sans-serif'],
          }
        }
      }
    }
  </script>
</head>
<body class="bg-[#0A0A0B] text-[#E2E2E2] antialiased overflow-hidden">
  <main class="h-screen">
    <nav
      class="fixed left-0 right-0 top-0 z-[70] border-b border-white/10 bg-[#0A0A0B]/90 px-4 py-3 font-sans text-xs uppercase tracking-[0.12em] text-zinc-400 backdrop-blur"
      aria-label="Reading days"
    >
      <div class="mx-auto flex max-w-[980px] justify-center">
        <span id="day-label" class="text-[#E2D2B0]">Day 1</span>
      </div>
    </nav>

    <button
      id="previous-day"
      type="button"
      class="fixed left-3 top-1/2 z-[70] flex h-11 w-11 -translate-y-1/2 items-center justify-center rounded-full border border-white/10 bg-black/35 font-sans text-2xl text-zinc-300 transition-colors hover:border-[#C4A67F]/60 hover:text-[#E2D2B0] disabled:border-white/5 disabled:text-zinc-700 sm:left-6"
      aria-label="Previous day"
    >&larr;</button>
    <button
      id="next-day"
      type="button"
      class="fixed right-3 top-1/2 z-[70] flex h-11 w-11 -translate-y-1/2 items-center justify-center rounded-full border border-white/10 bg-black/35 font-sans text-2xl text-zinc-300 transition-colors hover:border-[#C4A67F]/60 hover:text-[#E2D2B0] disabled:border-white/5 disabled:text-zinc-700 sm:right-6"
      aria-label="Next day"
    >&rarr;</button>

    <iframe
      id="reading-frame"
      class="h-full w-full border-0"
      title="Reading passage"
    ></iframe>
    <noscript>
      <p class="fixed inset-0 flex items-center justify-center px-6 font-sans text-sm text-zinc-400"><a class="text-[#C4A67F] underline" href="2026-06-21-222755/index.html">Open Day 1</a></p>
    </noscript>
  </main>
  <script id="reading-days" type="application/json">[{"label": "Day 1", "src": "2026-06-21-222755/index.html"}, {"label": "Day 2", "src": "2026-06-21-223033/index.html"}, {"label": "Day 3", "src": "2026-06-21-224252/index.html"}]</script>
  <script>
    const days = JSON.parse(document.getElementById('reading-days').textContent);
    const frame = document.getElementById('reading-frame');
    const label = document.getElementById('day-label');
    const previous = document.getElementById('previous-day');
    const next = document.getElementById('next-day');
    let current = 0;

    const render = () => {
      if (!days.length) {
        frame.remove();
        previous.disabled = true;
        next.disabled = true;
        label.textContent = 'Read';
        return;
      }

      const day = days[current];
      frame.src = day.src;
      label.textContent = day.label;
      previous.disabled = current === 0;
      next.disabled = current === days.length - 1;
    };

    previous.addEventListener('click', () => {
      if (current > 0) {
        current -= 1;
        render();
      }
    });

    next.addEventListener('click', () => {
      if (current < days.length - 1) {
        current += 1;
        render();
      }
    });

    render();
  </script>
</body>
</html>
