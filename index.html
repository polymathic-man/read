<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Read</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="fonts/fonts.css" rel="stylesheet">
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            serif: ['"Lora"', '"Crimson Pro"', 'Georgia', 'serif'],
            sans: ['"Inter"', '"Helvetica Neue"', 'system-ui', '-apple-system', 'sans-serif'],
          }
        }
      }
    }
  </script>
</head>
<body class="bg-[#070708] text-[#E2E2E2] antialiased overflow-hidden">
  <main class="h-screen">
    <nav
      class="fixed left-0 right-0 top-0 z-[70] border-b border-white/5 bg-[#070708]/90 px-4 py-3.5 font-sans text-xs uppercase tracking-[0.15em] text-zinc-400 backdrop-blur-md"
      aria-label="Reading days"
    >
      <div class="mx-auto grid max-w-[980px] grid-cols-3 items-center">
        <span aria-hidden="true"></span>
        <span id="day-label" class="text-center font-medium text-[#E2D2B0] transition-all duration-300">Day 1</span>
        <span
          id="audio-duration"
          class="text-right font-light text-[13px] leading-none tracking-wide text-[#888A8F]/75 tabular-nums opacity-0 transition-opacity duration-500"
          aria-hidden="true"
        ></span>
      </div>
    </nav>

    <!-- Desktop: flank chevrons sit in the margins, never over the reading column -->
    <button
      id="previous-day"
      type="button"
      class="hidden lg:flex fixed left-8 xl:left-14 top-1/2 z-[70] h-12 w-12 -translate-y-1/2 cursor-pointer items-center justify-center rounded-full border border-white/10 bg-black/40 font-sans text-zinc-300 shadow-lg backdrop-blur-md transition-all duration-300 hover:scale-110 hover:border-[#C4A67F]/60 hover:text-[#E2D2B0] active:scale-95 disabled:pointer-events-none disabled:opacity-0"
      aria-label="Previous day"
    >
      <svg class="h-5 w-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.25" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="m15 18-6-6 6-6"></path>
      </svg>
    </button>
    <button
      id="next-day"
      type="button"
      class="hidden lg:flex fixed right-8 xl:right-14 top-1/2 z-[70] h-12 w-12 -translate-y-1/2 cursor-pointer items-center justify-center rounded-full border border-white/10 bg-black/40 font-sans text-zinc-300 shadow-lg backdrop-blur-md transition-all duration-300 hover:scale-110 hover:border-[#C4A67F]/60 hover:text-[#E2D2B0] active:scale-95 disabled:pointer-events-none disabled:opacity-0"
      aria-label="Next day"
    >
      <svg class="h-5 w-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.25" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="m9 18 6-6-6-6"></path>
      </svg>
    </button>

    <!-- Mobile/tablet: bottom pill keeps controls off the passage text -->
    <div
      id="tablet-mobile-controls"
      class="fixed bottom-5 left-1/2 z-[70] flex lg:hidden w-[min(100%,20rem)] -translate-x-1/2 items-center justify-between rounded-full border border-white/5 bg-[#0E0E10]/95 px-5 py-2.5 font-sans shadow-2xl backdrop-blur-md select-none"
    >
      <button
        id="mobile-previous-day"
        type="button"
        class="flex cursor-pointer items-center gap-1 text-xs font-medium tracking-wider text-zinc-400 transition-colors hover:text-[#E2D2B0] disabled:pointer-events-none disabled:opacity-20 focus:outline-none"
        aria-label="Previous day"
      >
        <svg class="h-4 w-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.25" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="m15 18-6-6 6-6"></path>
        </svg>
        Prev Day
      </button>
      <span id="mobile-day-label" class="text-[10px] font-semibold tracking-widest text-[#C4A67F]">DAY 1</span>
      <button
        id="mobile-next-day"
        type="button"
        class="flex cursor-pointer items-center gap-1 text-xs font-medium tracking-wider text-zinc-400 transition-colors hover:text-[#E2D2B0] disabled:pointer-events-none disabled:opacity-20 focus:outline-none"
        aria-label="Next day"
      >
        Next Day
        <svg class="h-4 w-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.25" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="m9 18 6-6-6-6"></path>
        </svg>
      </button>
    </div>

    <div id="reading-frame-wrap" class="h-full w-full pt-14 pb-[4.75rem] lg:pt-0 lg:pb-0">
      <iframe
        id="reading-frame"
        class="h-full w-full border-0"
        title="Reading passage"
      ></iframe>
    </div>
    <noscript>
      <p class="fixed inset-0 flex items-center justify-center px-6 font-sans text-sm text-zinc-400"><a class="text-[#C4A67F] underline" href="2026-07-11-120652/index.html">Open Day 1</a></p>
    </noscript>
  </main>
  <script id="reading-days" type="application/json">[{"label": "Day 1", "src": "2026-07-11-120652/index.html"}, {"label": "Day 2", "src": "2026-06-21-222755/index.html"}, {"label": "Day 3", "src": "2026-06-21-223033/index.html"}, {"label": "Day 4", "src": "2026-06-21-224252/index.html"}, {"label": "Day 5", "src": "2026-06-21-230448/index.html"}, {"label": "Day 6", "src": "2026-06-22-153027/index.html"}, {"label": "Day 7", "src": "2026-06-22-161831/index.html"}, {"label": "Day 8", "src": "2026-06-22-171514/index.html"}, {"label": "Day 9", "src": "2026-06-22-222845/index.html"}, {"label": "Day 10", "src": "2026-06-23-211752/index.html"}, {"label": "Day 11", "src": "2026-06-23-212211/index.html"}, {"label": "Day 12", "src": "2026-06-24-122541/index.html"}, {"label": "Day 13", "src": "2026-06-25-122551/index.html"}, {"label": "Day 14", "src": "2026-06-25-164651/index.html"}, {"label": "Day 15", "src": "2026-06-26-110244/index.html"}, {"label": "Day 16", "src": "2026-06-26-124906/index.html"}, {"label": "Day 17", "src": "2026-06-30-121734/index.html"}, {"label": "Day 18", "src": "2026-07-01-121456/index.html"}, {"label": "Day 19", "src": "2026-07-02-122826/index.html"}, {"label": "Day 20", "src": "2026-07-03-095447/index.html"}, {"label": "Day 21", "src": "2026-07-03-122059/index.html"}, {"label": "Day 22", "src": "2026-07-06-121628/index.html"}, {"label": "Day 23", "src": "2026-07-07-124635/index.html"}, {"label": "Day 24", "src": "2026-07-08-124555/index.html"}, {"label": "Day 25", "src": "2026-07-09-125435/index.html"}, {"label": "Day 26", "src": "2026-07-10-123330/index.html"}]</script>
  <script>
    const days = JSON.parse(document.getElementById('reading-days').textContent);
    const frame = document.getElementById('reading-frame');
    const label = document.getElementById('day-label');
    const audioDuration = document.getElementById('audio-duration');
    const mobileLabel = document.getElementById('mobile-day-label');
    const previous = document.getElementById('previous-day');
    const next = document.getElementById('next-day');
    const mobilePrevious = document.getElementById('mobile-previous-day');
    const mobileNext = document.getElementById('mobile-next-day');
    const durationProbe = new Audio();
    let current = 0;

    const updateShellDuration = () => {
      const seconds = durationProbe.duration;
      if (!seconds || !Number.isFinite(seconds)) return;
      audioDuration.textContent = `${Math.round(seconds)}s`;
      audioDuration.classList.remove('opacity-0');
      audioDuration.removeAttribute('aria-hidden');
    };

    const loadShellDuration = (daySrc) => {
      audioDuration.textContent = '';
      audioDuration.classList.add('opacity-0');
      audioDuration.setAttribute('aria-hidden', 'true');
      const wavSrc = daySrc.replace(/\/index\.html$/, '/passage_narration.wav');
      durationProbe.removeAttribute('src');
      durationProbe.load();
      durationProbe.src = wavSrc;
      durationProbe.addEventListener('loadedmetadata', updateShellDuration, { once: true });
      durationProbe.load();
    };

    const render = () => {
      if (!days.length) {
        frame.remove();
        previous.disabled = true;
        next.disabled = true;
        mobilePrevious.disabled = true;
        mobileNext.disabled = true;
        label.textContent = 'Read';
        mobileLabel.textContent = 'READ';
        audioDuration.textContent = '';
        audioDuration.classList.add('opacity-0');
        return;
      }

      const day = days[current];
      frame.src = day.src;
      label.textContent = day.label;
      mobileLabel.textContent = day.label.toUpperCase();
      previous.disabled = current === 0;
      next.disabled = current === days.length - 1;
      mobilePrevious.disabled = current === 0;
      mobileNext.disabled = current === days.length - 1;
      loadShellDuration(day.src);
    };

    const goPrevious = () => {
      if (current > 0) {
        current -= 1;
        render();
      }
    };

    const goNext = () => {
      if (current < days.length - 1) {
        current += 1;
        render();
      }
    };

    previous.addEventListener('click', goPrevious);
    next.addEventListener('click', goNext);
    mobilePrevious.addEventListener('click', goPrevious);
    mobileNext.addEventListener('click', goNext);

    render();
  </script>
</body>
</html>
